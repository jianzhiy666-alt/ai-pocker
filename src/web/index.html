<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🤠 AI 扑克擂台 — 德州扑克 AI 对战</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>🤠 AI 扑克擂台</h1>
      <span id="level-info" class="level-info"></span>
    </div>
    <div class="controls">
      <button id="btn-pause" class="primary">⏸ 暂停</button>
      <button id="btn-restart">🔄 新一局</button>
      <label class="speed">
        速度
        <select id="speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
        </select>
      </label>
      <span id="mode" class="mode"></span>
      <span id="conn" class="conn">连接中…</span>
    </div>
  </header>

  <main>
    <section id="table-wrap">
      <div id="table">
        <div id="community">
          <div id="community-cards">
            <div class="card back"></div>
            <div class="card back"></div>
            <div class="card back"></div>
            <div class="card back"></div>
            <div class="card back"></div>
          </div>
          <div id="pot">底池 0</div>
          <div id="hand-num"></div>
        </div>
        <div id="seats"></div>
      </div>
      <div id="champion-banner" class="hidden"></div>
    </section>

    <aside id="sidebar">
      <div id="rankings">
        <h2>🏆 战况 <span id="hand-count"></span></h2>
        <ul id="ranking-list"></ul>
      </div>
      <div id="log">
        <h2>📜 牌局直播</h2>
        <div id="log-body"></div>
      </div>
    </aside>
  </main>

  <!-- 玩家配置弹窗（点击座位打开） -->
  <div id="player-modal" class="pmodal hidden">
    <div class="pmodal-box">
      <div class="pmodal-head">
        <h2>⚙️ 玩家配置</h2>
        <button id="pm-close">✕</button>
      </div>
      <div class="pmodal-body">
        <div class="pm-row"><label>玩家</label><span id="pm-name" class="pm-val"></span></div>
        <div class="pm-row">
          <label>Provider</label>
          <select id="pm-provider"></select>
        </div>
        <div class="pm-row">
          <label>模型</label>
          <input id="pm-model" placeholder="留空用该 provider 默认模型" spellcheck="false" />
        </div>
        <div class="pm-row">
          <label>API Key</label>
          <input id="pm-key" type="password" placeholder="粘贴该 provider 的 API key" spellcheck="false" autocomplete="off" />
          <span id="pm-key-status" class="pm-status"></span>
        </div>
        <div class="pm-tip">💡 保存后比赛会自动重启，新配置立即生效。模型填 OpenRouter 的 ID（如 <code>qwen/qwen3-30b-a3b-instruct-2507</code>）或官方模型名。</div>
        <div class="pm-actions">
          <button id="pm-save" class="primary">💾 保存并重启</button>
          <span id="pm-msg"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
